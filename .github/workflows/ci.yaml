name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          coverage: none
      - name: Use Composer lock for development tools
        run: cp composer-8.5.lock composer.lock
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      - name: Run lint
        run: composer lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - php-version: '8.1'
            ini-values: opcache.enable_cli=1, opcache.jit=tracing
          - php-version: '8.2'
            ini-values: opcache.enable_cli=1, opcache.jit=tracing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore cached Docker images
        id: docker-images-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images.tar
          key: docker-images-v2-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            docker-images-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Load cached Docker images
        if: steps.docker-images-cache.outputs.cache-matched-key != ''
        run: docker load --input /tmp/docker-images.tar

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          ini-values: ${{ matrix.ini-values || 'opcache.enable_cli=1' }}

      - name: Use Composer lock for PHP ${{ matrix.php-version }}
        run: cp composer-${{ matrix.php-version }}.lock composer.lock

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0

      - name: Record Docker images before tests
        id: docker-images-before
        run: |
          {
            echo 'images<<EOF'
            docker images --filter dangling=false --no-trunc --format '{"image":"{{.Repository}}:{{.Tag}}","id":"{{.ID}}"}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: composer test

      - name: Record Docker images after tests
        id: docker-images-after
        run: |
          {
            echo 'images<<EOF'
            docker images --filter dangling=false --no-trunc --format '{"image":"{{.Repository}}:{{.Tag}}","id":"{{.ID}}"}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Export Docker images
        id: docker-images-export
        if: >-
          steps.docker-images-after.outputs.images != '' &&
          (steps.docker-images-cache.outputs.cache-matched-key == '' ||
           steps.docker-images-before.outputs.images != steps.docker-images-after.outputs.images)
        run: |
          docker save --output /tmp/docker-images.tar $(docker images --filter dangling=false --format '{{.Repository}}:{{.Tag}}')

      - name: Save Docker images to cache
        if: steps.docker-images-export.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images.tar
          key: docker-images-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
